<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Symbol — Design your story · Opzione B</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/style.css?v=5">
<style>
/* OPZIONE B — L'ora. Avorio piatto e un'ombra netta che si sposta lenta, come il sole su una parete. */
.b{position:relative;height:100vh;min-height:560px;background:var(--avorio);overflow:hidden;color:var(--inchiostro)}
.b .ombra{position:absolute;inset:0;background:#8a8486;
  clip-path:polygon(0 0,100% 0,100% 100%,78% 100%,44% 30%,0 30%);
  animation:ora 18s ease-in-out infinite alternate}
@keyframes ora{
  from{clip-path:polygon(0 0,100% 0,100% 100%,78% 100%,44% 30%,0 30%)}
  to  {clip-path:polygon(0 0,100% 0,100% 100%,60% 100%,38% 42%,0 42%)}}
.b .seg{position:absolute;left:50%;width:1px;background:var(--inchiostro);z-index:1}
.b .su{top:0;height:calc(50% - 125px)}
.b .giu{bottom:0;height:calc(50% - 125px)}
.b .centro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;
  align-items:center;gap:30px;padding:28px 0}
.b .logo-box{padding:22px 0}
.b .centro img{width:min(260px,52vw);animation:emergi 1.6s .3s both}
.b .claim{margin:0;padding:12px 0;font-size:.8rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ardesia);animation:emergi 1.6s .8s both}
.b .nav{color:var(--inchiostro)}
.b .nav a{opacity:1}
</style>
</head>
<body>
<nav class="nav"><span></span><ul>
  <li><a href="lavori/">Lavori</a></li><li><a href="studio.html">Studio</a></li><li><a href="contatti.html">Contatti</a></li>
</ul></nav>
<main class="b">
  <div class="ombra" aria-hidden="true"></div>
  <span class="seg su" aria-hidden="true"></span><span class="seg giu" aria-hidden="true"></span>
  <div class="centro">
    <div class="logo-box"><img src="assets/logo.svg" alt="The Symbol"></div>
    <p class="claim">Design your story</p>
  </div>
</main>
</body>
</html>
