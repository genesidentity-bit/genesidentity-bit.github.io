<body>
<div class="band"><a class="logo" href="#home" aria-label="FortyEight Brussels, home"><img src="assets/logo.svg" alt="FortyEight Brussels"></a></div>
<button class="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="drawer"><span></span></button>
<nav class="drawer bignav" id="drawer" aria-label="Main" inert></nav>

<script src="content.js?v=20261114zr"></script>

<script>
(function(){var r=function(a,b){return a+Math.random()*(b-a)},d=Math.random()<.5?1:-1,s=document.documentElement.style,
a=r(3,5.5),z=r(3,7)/100,v=(Math.random()<.5?1:-1)*r(0,1.5);
s.setProperty("--tex-dur",r(6,9).toFixed(2)+"s");
s.setProperty("--tx-a",(-a*d).toFixed(2)+"%");s.setProperty("--tx-b",(a*d).toFixed(2)+"%");
s.setProperty("--ty-a",(-v/2).toFixed(2)+"%");s.setProperty("--ty-b",(v/2).toFixed(2)+"%");
var zin=Math.random()<.5,lo=1.12,hi=lo+z;
s.setProperty("--sc-a",(zin?lo:hi).toFixed(3));s.setProperty("--sc-b",(zin?hi:lo).toFixed(3));
s.setProperty("--mx-a",d>0?"0%":"100%");s.setProperty("--mx-b",d>0?"100%":"0%");
s.setProperty("--mz",(112+z*100).toFixed(0)+"%");})();
</script>
<script src="js/main.js?v=20261124c"></script>
<script src="js/mix.js?v=1"></script>
</body>
